syntax = "proto3";

option csharp_namespace = "ThatsMyQuant.Gateway.Api.Protos";

package tradeengine;

// The core gateway streaming multiplexer for the headless execution bot.
service TradingGateway {
  // Initiates a continuous bidirectional stream. The UI sends control signals, while the Engine streams live PnL/Ticks.
  rpc ConnectStream (stream ClientSignal) returns (stream EngineTelemetry);
}

// Sent from WPF Dashboard to the Linux Gateway
message ClientSignal {
  enum SignalType {
    ARM_ENGINE = 0;
    DISARM_ENGINE = 1;
    EMERGENCY_STOP = 2;
    UPDATE_RISK = 3;
  }
  
  SignalType type = 1;
  string payload_json = 2; // Configurations, HSM Tokens, etc.
}

// Streamed 60 times a second back to the WPF Client
message EngineTelemetry {
  string timestamp_utc = 1;
  double active_pnl = 2;
  double margin_utilized = 3;
  string latest_execution_log = 4;
  int32 open_positions_count = 5;
  string swarm_consensus_status = 6;
}

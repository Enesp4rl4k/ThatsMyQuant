name: ci

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore ThatsMyQuant.sln

      - name: Build dashboard
        run: dotnet build 04_UI/ThatsMyQuant.Dashboard/ThatsMyQuant.Dashboard.csproj --no-restore -v minimal

      - name: Run core tests
        run: dotnet test 05_Tests/ThatsMyQuant.Tests/ThatsMyQuant.Tests.csproj --no-restore -v minimal

      - name: Run dashboard tests
        run: dotnet test 05_Tests/ThatsMyQuant.Dashboard.Tests/ThatsMyQuant.Dashboard.Tests.csproj --no-restore -v minimal

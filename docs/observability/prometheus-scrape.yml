# Drop this into prometheus.yml (or prometheus.d/). Scrapes /metrics from the
# Listener.Api + Gateway.Api endpoints exposed by ThatsMyQuant. Worker services
# also expose /metrics via WorkerManagementApiHostedService on their configured
# management ports.
#
# After copying, run:
#   docker run -p 9090:9090 -v $(pwd)/prometheus.yml:/etc/prometheus/prometheus.yml prom/prometheus
# then import grafana-dashboard.json into Grafana pointing at this Prometheus.

scrape_configs:
  - job_name: thatsmyquant-listener
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["localhost:5001"]   # adjust to your Listener.Api port
        labels: { service: listener }

  - job_name: thatsmyquant-gateway
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["localhost:5002"]   # adjust to your Gateway.Api port
        labels: { service: gateway }

  - job_name: thatsmyquant-quantengine
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:5701"]   # adjust to QuantEngine.Worker management port
        labels: { service: quantengine }

  - job_name: thatsmyquant-execution
    metrics_path: /metrics
    scrape_interval: 5s               # tighter — execution latency matters
    static_configs:
      - targets: ["localhost:5702"]   # adjust to Execution.Worker management port
        labels: { service: execution }
